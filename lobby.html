<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="lobby.title">Demon Chase - Lobby</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-673VQ9VE50"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-673VQ9VE50');
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }

        .logo {
            font-size: 3em;
            text-align: center;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin-bottom: 15px;
        }

        input[type="text"]::placeholder {
            color: #888;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .room-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .room-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .room-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .room-info h3 {
            font-size: 1.1em;
        }

        .room-info span {
            font-size: 0.9em;
            opacity: 0.7;
        }

        .player-count {
            font-size: 1.2em;
            font-weight: bold;
        }

        .player-list {
            margin: 20px 0;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .player-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ready-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8em;
        }

        .ready-yes {
            background: #38ef7d;
            color: #000;
        }

        .ready-no {
            background: #f45c43;
        }

        .host-badge {
            background: #ffd700;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            opacity: 0.5;
        }

        .welcome-msg {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .preset-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95em;
            text-align: center;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .preset-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        .quiz-slider-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slider-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-item label {
            flex: 0 0 160px;
            font-size: 0.85em;
        }

        .slider-item input[type="range"] {
            flex: 1;
            margin: 0;
            padding: 0;
            cursor: pointer;
            accent-color: #667eea;
        }

        .slider-item .pct {
            flex: 0 0 35px;
            font-size: 0.85em;
            text-align: right;
            opacity: 0.9;
        }

        .quiz-preset-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-quiz-preset {
            flex: 1;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .btn-quiz-preset:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn-quiz-preset.active {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="panel">
            <div class="logo">⚔️</div>
            <h1 data-i18n="lobby.login.header">Demon Chase</h1>
            <div id="loginError" class="error hidden"></div>
            <input type="text" id="usernameInput" data-i18n-placeholder="lobby.login.usernamePlaceholder" placeholder="Enter your username" maxlength="20">
            <button class="btn-primary" onclick="register()" data-i18n="lobby.login.playOnline">Play Online</button>
            <button class="btn-secondary" onclick="playSolo()" data-i18n="lobby.login.practiceSolo">Practice (Solo)</button>
        </div>

        <!-- Lobby Screen -->
        <div id="lobbyScreen" class="panel hidden">
            <h2 style="margin-bottom: 20px;" data-i18n="lobby.rooms.header">🎮 Game Rooms</h2>
            <p id="welcomeMsg" class="welcome-msg"></p>

            <div class="room-list" id="roomList">
                <!-- Rooms will be populated here -->
            </div>

            <button class="btn-primary" onclick="quickPlay()" data-i18n="lobby.rooms.quickPlay">⚡ Quick Play</button>
            <button class="btn-secondary" onclick="showCreateRoom()" data-i18n="lobby.rooms.createRoom">+ Create Room</button>
            <div class="divider">or</div>
            <button class="btn-secondary" onclick="logout()" data-i18n="lobby.rooms.logout">Logout</button>
        </div>

        <!-- Create Room Screen -->
        <div id="createRoomScreen" class="panel hidden">
            <h2 style="margin-bottom: 20px;" data-i18n="lobby.create.header">Create Room</h2>
            <input type="text" id="roomNameInput" data-i18n-placeholder="lobby.create.roomNamePlaceholder" placeholder="Room name (optional)">

            <div style="margin: 20px 0;">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;">Game Mode:</label>
                <div class="difficulty-selector">
                    <button class="preset-btn active" data-gamemode="classic" onclick="selectGameMode('classic')">
                        <div style="font-weight: bold; margin-bottom: 5px;">Classic</div>
                        <div style="font-size: 0.85em; opacity: 0.8;">5-level progression</div>
                    </button>
                    <button class="preset-btn" data-gamemode="mission" onclick="selectGameMode('mission')">
                        <div style="font-weight: bold; margin-bottom: 5px;">Mission</div>
                        <div style="font-size: 0.85em; opacity: 0.8;">Campaign mission</div>
                    </button>
                </div>
            </div>

            <div id="missionPicker" style="margin: 20px 0; display: none;">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;">Chapter:</label>
                <select id="chapterSelect"
                    style="width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 1.1em; background: rgba(255, 255, 255, 0.9); color: #333; margin-bottom: 10px;">
                    <option value="">-- Select Chapter --</option>
                </select>
                <label style="display: block; margin-bottom: 10px; font-weight: bold;">Mission:</label>
                <select id="missionSelect"
                    style="width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 1.1em; background: rgba(255, 255, 255, 0.9); color: #333; margin-bottom: 10px;"
                    disabled>
                    <option value="">-- Select Mission --</option>
                </select>
                <p id="missionDescription" style="font-size: 0.9em; opacity: 0.8; min-height: 1.5em;"></p>
            </div>

            <div id="mapStyleSection" style="margin: 20px 0;">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;" data-i18n="lobby.create.mapStyle">Map Style:</label>
                <select id="mapStyleInput"
                    style="width: 100%; padding: 15px; border-radius: 10px; border: none; font-size: 1.1em; background: rgba(255, 255, 255, 0.9);">
                    <option value="classic" data-i18n="mapStyles.classic">Classic Dungeon</option>
                    <option value="narrow" data-i18n="mapStyles.narrow">Narrow Paths</option>
                    <option value="labyrinth" data-i18n="mapStyles.labyrinth">Complex Labyrinth</option>
                    <option value="open" data-i18n="mapStyles.open">Open Plains</option>
                    <option value="city" data-i18n="mapStyles.city">Grid City</option>
                </select>
            </div>

            <div id="difficultySection" style="margin: 20px 0;">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;" data-i18n="lobby.create.monsterDifficulty">Monster Difficulty:</label>
                <div class="difficulty-selector">
                    <button class="preset-btn" data-preset="easy" onclick="selectPreset('easy')">
                        <div style="font-weight: bold; margin-bottom: 5px;" data-i18n="config.difficultyEasy">Easy</div>
                        <div style="font-size: 0.85em; opacity: 0.8;" data-i18n="config.difficultyEasyDesc">Weaker monsters</div>
                    </button>
                    <button class="preset-btn active" data-preset="normal" onclick="selectPreset('normal')">
                        <div style="font-weight: bold; margin-bottom: 5px;" data-i18n="config.difficultyMedium">Normal</div>
                        <div style="font-size: 0.85em; opacity: 0.8;" data-i18n="config.difficultyNormalDesc">Balanced combat</div>
                    </button>
                    <button class="preset-btn" data-preset="hard" onclick="selectPreset('hard')">
                        <div style="font-weight: bold; margin-bottom: 5px;" data-i18n="config.difficultyHard">Hard</div>
                        <div style="font-size: 0.85em; opacity: 0.8;" data-i18n="config.difficultyHardDesc">Intense combat</div>
                    </button>
                </div>
            </div>

            <div style="margin: 20px 0;">
                <label style="display: block; margin-bottom: 10px; font-weight: bold;" data-i18n="lobby.create.quizBalance">Quiz Balance:</label>
                <div class="quiz-slider-group">
                    <div class="slider-item">
                        <label><span data-i18n="config.firstLetter">First Letter</span> <span style="opacity:0.6" data-i18n="config.difficultyHard">(Hard)</span></label>
                        <input type="range" min="0" max="100" value="30" step="5" data-mode="firstLetter"
                            class="quiz-slider">
                        <span class="pct">30%</span>
                    </div>
                    <div class="slider-item">
                        <label><span data-i18n="config.missingWord">Missing Word</span> <span style="opacity:0.6" data-i18n="config.difficultyMedium">(Medium)</span></label>
                        <input type="range" min="0" max="100" value="30" step="5" data-mode="missingWord"
                            class="quiz-slider">
                        <span class="pct">30%</span>
                    </div>
                    <div class="slider-item">
                        <label><span data-i18n="config.categoryMatch">Category Match</span> <span style="opacity:0.6" data-i18n="config.difficultyEasy">(Easy)</span></label>
                        <input type="range" min="0" max="100" value="25" step="5" data-mode="categoryMatch"
                            class="quiz-slider">
                        <span class="pct">25%</span>
                    </div>
                    <div class="slider-item">
                        <label><span data-i18n="config.trueFalse">True / False</span> <span style="opacity:0.6">(Easiest)</span></label>
                        <input type="range" min="0" max="100" value="15" step="5" data-mode="trueFalse"
                            class="quiz-slider">
                        <span class="pct">15%</span>
                    </div>
                </div>
                <div class="quiz-preset-btns">
                    <button class="btn-quiz-preset" data-qpreset="easy" onclick="applyQuizPreset('easy')" data-i18n="config.quizPresetEasy">Easy Quizzes</button>
                    <button class="btn-quiz-preset active" data-qpreset="balanced"
                        onclick="applyQuizPreset('balanced')" data-i18n="config.quizPresetBalanced">Balanced</button>
                    <button class="btn-quiz-preset" data-qpreset="hard" onclick="applyQuizPreset('hard')" data-i18n="config.quizPresetHard">Hard Quizzes</button>

            <button class="btn-success" onclick="createRoom()" data-i18n="lobby.create.createAndJoin">Create & Join</button>
            <button class="btn-secondary" onclick="showLobby()" data-i18n="lobby.create.back">← Back</button>
        </div>

        <!-- Room Screen -->
        <div id="roomScreen" class="panel hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="roomTitle" data-i18n="lobby.room.header">Room</h2>
                <button class="btn-danger" style="width: auto; padding: 8px 15px;" onclick="leaveRoom()" data-i18n="lobby.room.leave">Leave</button>

            <button id="readyBtn" class="btn-secondary" onclick="toggleReady()" data-i18n="lobby.room.readyUp">Ready Up</button>
            <button id="startBtn" class="btn-success hidden" onclick="startGame()" data-i18n="lobby.room.startGame">Start Game</button>
        </div>
    </div>

        I18n.loadSync();
        I18n.updateDOM();
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
    (function () {
        let sessionStartTime = null;

        function track(eventName, params) {
            if (typeof gtag !== 'undefined') {
                gtag('event', eventName, params || {});
            }
        }

        function trackLobbyEnter() {
            sessionStartTime = performance.now();
            track('lobby_enter', {});
            
            var lastVisit = localStorage.getItem('lastVisitDate');
            var today = new Date().toISOString().split('T')[0];
            if (lastVisit && lastVisit !== today) {
                var lastDate = new Date(lastVisit);
                var todayDate = new Date(today);
                var daysSince = Math.round((todayDate - lastDate) / (1000 * 60 * 60 * 24));
                track('return_visit', { days_since_last: daysSince });
            }
            localStorage.setItem('lastVisitDate', today);
        }

        function trackRoomCreated(difficulty, quizSettings) {
            track('room_created', {
                difficulty: difficulty,
                quiz_first_letter: quizSettings.firstLetter,
                quiz_missing_word: quizSettings.missingWord,
                quiz_category_match: quizSettings.categoryMatch,
                quiz_true_false: quizSettings.trueFalse
            });
        }

        function trackRoomJoined(playerCount) {
            track('room_joined', { player_count: playerCount });
        }

        function trackRoomLeave() {
            if (sessionStartTime) {
                var duration = Math.round((performance.now() - sessionStartTime) / 1000);
                track('room_leave', { duration_sec: duration });
            }
        }

        window.LobbyAnalytics = {
            track: track,
            trackLobbyEnter: trackLobbyEnter,
            trackRoomCreated: trackRoomCreated,
            trackRoomJoined: trackRoomJoined,
            trackRoomLeave: trackRoomLeave
        };
    })();
    </script>
    <script>
        // State
        let socket = null;
        let sessionToken = localStorage.getItem('sessionToken');
        let currentUser = null;
        let currentRoom = null;
        let isReady = false;
        let selectedPreset = 'normal';
        let selectedGameMode = 'classic';
        let chaptersData = null;
        let chapterMissions = {};  // chapterId -> missions array

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (sessionToken) {
                tryLogin();
            }
            // Set up chapter/mission dropdowns
            document.getElementById('chapterSelect').addEventListener('change', onChapterSelected);
            document.getElementById('missionSelect').addEventListener('change', onMissionSelected);
        });

        // ==================== Auth ====================

        async function register() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                showError('loginError', t('lobby.login.errorUsername'));
                return;
            }

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();

                if (data.success) {
                    sessionToken = data.user.sessionToken;
                    localStorage.setItem('sessionToken', sessionToken);
                    currentUser = data.user;
                    connectSocket();
                } else {
                    showError('loginError', data.error);
                }
            } catch (err) {
                showError('loginError', t('lobby.login.errorConnection'));
            }
        }

        async function tryLogin() {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionToken })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data.user;
                    connectSocket();
                    if (window.LobbyAnalytics) LobbyAnalytics.trackLobbyEnter();
                } else {
                    localStorage.removeItem('sessionToken');
                    sessionToken = null;
                }
            } catch (err) {
                console.error('Login error:', err);
            }
        }

        function logout() {
            localStorage.removeItem('sessionToken');
            sessionToken = null;
            currentUser = null;
            if (socket) socket.disconnect();
            showScreen('loginScreen');
        }

        function playSolo() {
            let soloUrl = '/?solo=true';
            if (localStorage.getItem('lang') === 'es') {
                soloUrl += '&lang=es';
            }
            window.location.href = soloUrl;
        }

        // ==================== Socket ====================

        function connectSocket() {
            socket = io();

            socket.on('connect', () => {
                socket.emit('authenticate', sessionToken, (result) => {
                    if (result.success) {
                        showLobby();
                        refreshRooms();
                    } else {
                        logout();
                    }
                });
            });

            socket.on('roomListUpdated', ({ rooms }) => {
                renderRoomList(rooms);
            });

            socket.on('roomUpdated', ({ room }) => {
                if (currentRoom && room.id === currentRoom.id) {
                    currentRoom = room;
                    renderRoom();
                }
            });

            socket.on('playerLeft', ({ playerId, room }) => {
                if (currentRoom && room) {
                    currentRoom = room;
                    renderRoom();
                }
            });

            socket.on('gameStarted', ({ roomId }) => {
                // Redirect to game
                window.location.href = `/?room=${roomId}`;
            });
        }

        // ==================== Rooms ====================

        function refreshRooms() {
            socket.emit('getRooms', (result) => {
                renderRoomList(result.rooms);
            });
        }

        function renderRoomList(rooms) {
            const container = document.getElementById('roomList');
            if (rooms.length === 0) {
                container.innerHTML = `<p style="text-align: center; opacity: 0.6;">${t('lobby.rooms.noRooms')}</p>`;
                return;
            }

            container.innerHTML = rooms.map(room => {
                const isPlaying = room.status === 'playing';
                const badge = isPlaying ? `<span style="color:#ffaa00;font-size:11px;margin-left:6px;">${t('lobby.rooms.inProgress')}</span>` : '';
                const clickAction = isPlaying ? `joinInProgressGame('${room.id}')` : `joinRoom('${room.id}')`;
                const isMission = room.settings.gameMode === 'mission';
                const modeLabel = isMission
                    ? ('Mission: ' + (room.settings.missionName || room.settings.missionId))
                    : t(`config.difficulty${room.settings.preset.charAt(0).toUpperCase() + room.settings.preset.slice(1)}`);
                const category = room.settings.category ? tCategory(room.settings.category) : '';
                const subtitle = category ? (modeLabel + ' • ' + category) : modeLabel;
                return `
                <div class="room-item" onclick="${clickAction}">
                    <div class="room-info">
                        <h3>📦 ${room.name}${badge}</h3>
                        <span>${subtitle}</span>
                    </div>
                    <div class="player-count">${room.playerCount}/${room.maxPlayers}</div>
                </div>
                `;
            }).join('');
        }

        function showCreateRoom() {
            showScreen('createRoomScreen');
            selectedPreset = 'normal';
            updatePresetButtons();
            applyQuizPreset('balanced');
            setupQuizSliders();
            selectGameMode('classic');
        }

        // ==================== Game Mode Selection ====================

        function selectGameMode(mode) {
            selectedGameMode = mode;
            document.querySelectorAll('[data-gamemode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.gamemode === mode);
            });

            const missionPicker = document.getElementById('missionPicker');
            const mapStyleSection = document.getElementById('mapStyleSection');
            const difficultySection = document.getElementById('difficultySection');

            if (mode === 'mission') {
                missionPicker.style.display = 'block';
                mapStyleSection.style.display = 'none';
                difficultySection.style.display = 'none';
                loadChapters();
            } else {
                missionPicker.style.display = 'none';
                mapStyleSection.style.display = 'block';
                difficultySection.style.display = 'block';
            }
        }

        async function loadChapters() {
            if (chaptersData) return;
            try {
                const res = await fetch('/missions/chapters.json');
                chaptersData = await res.json();
                const select = document.getElementById('chapterSelect');
                select.innerHTML = '<option value="">-- Select Chapter --</option>';
                chaptersData.chapters.forEach(ch => {
                    const opt = document.createElement('option');
                    opt.value = ch.id;
                    opt.textContent = ch.name;
                    opt.dataset.slug = ch.slug;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error('Failed to load chapters:', err);
            }
        }

        async function onChapterSelected() {
            const chapterSelect = document.getElementById('chapterSelect');
            const missionSelect = document.getElementById('missionSelect');
            const chapterId = chapterSelect.value;
            document.getElementById('missionDescription').textContent = '';

            if (!chapterId) {
                missionSelect.innerHTML = '<option value="">-- Select Mission --</option>';
                missionSelect.disabled = true;
                return;
            }

            // Load chapter missions if not cached
            if (!chapterMissions[chapterId]) {
                const chapter = chaptersData.chapters.find(c => c.id === chapterId);
                if (!chapter) return;
                try {
                    const res = await fetch('/missions/' + chapter.slug + '.json');
                    const data = await res.json();
                    chapterMissions[chapterId] = data.missions;
                } catch (err) {
                    console.error('Failed to load chapter missions:', err);
                    return;
                }
            }

            const missions = chapterMissions[chapterId];
            missionSelect.innerHTML = '<option value="">-- Select Mission --</option>';
            missions.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name;
                missionSelect.appendChild(opt);
            });
            missionSelect.disabled = false;
        }

        function onMissionSelected() {
            const chapterId = document.getElementById('chapterSelect').value;
            const missionId = document.getElementById('missionSelect').value;
            const descEl = document.getElementById('missionDescription');

            if (!chapterId || !missionId || !chapterMissions[chapterId]) {
                descEl.textContent = '';
                return;
            }

            const mission = chapterMissions[chapterId].find(m => m.id === missionId);
            descEl.textContent = mission ? mission.description : '';
        }

        function selectPreset(preset) {
            selectedPreset = preset;
            updatePresetButtons();
        }

        function updatePresetButtons() {
            document.querySelectorAll('.preset-btn').forEach(btn => {
                if (btn.dataset.preset === selectedPreset) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // ==================== Quiz Balance Sliders ====================

        let quizSlidersInitialized = false;

        function setupQuizSliders() {
            if (quizSlidersInitialized) return;
            quizSlidersInitialized = true;

            document.querySelectorAll('.quiz-slider').forEach(slider => {
                slider.addEventListener('input', () => {
                    redistributeQuizSliders(slider);
                    // Clear active quiz preset button (now custom)
                    document.querySelectorAll('.btn-quiz-preset').forEach(b => b.classList.remove('active'));
                });
            });
        }

        function redistributeQuizSliders(changedSlider) {
            const sliders = document.querySelectorAll('.quiz-slider');
            const changedMode = changedSlider.dataset.mode;
            const newVal = parseInt(changedSlider.value, 10);
            const remaining = 100 - newVal;

            let otherSum = 0;
            sliders.forEach(s => {
                if (s.dataset.mode !== changedMode) otherSum += parseInt(s.value, 10);
            });

            sliders.forEach(s => {
                if (s.dataset.mode !== changedMode) {
                    if (otherSum === 0) {
                        s.value = Math.round(remaining / (sliders.length - 1) / 5) * 5;
                    } else {
                        s.value = Math.round((parseInt(s.value, 10) / otherSum) * remaining / 5) * 5;
                    }
                }
            });

            // Fix rounding to ensure sum is exactly 100
            let total = 0;
            sliders.forEach(s => { total += parseInt(s.value, 10); });
            if (total !== 100) {
                for (let i = sliders.length - 1; i >= 0; i--) {
                    if (sliders[i].dataset.mode !== changedMode) {
                        sliders[i].value = parseInt(sliders[i].value, 10) + (100 - total);
                        break;
                    }
                }
            }

            updateQuizSliderLabels();
        }

        function updateQuizSliderLabels() {
            document.querySelectorAll('.quiz-slider').forEach(s => {
                const pct = s.closest('.slider-item').querySelector('.pct');
                pct.textContent = s.value + '%';
            });
        }

        function applyQuizPreset(type) {
            const presets = {
                easy: { firstLetter: 5, missingWord: 15, categoryMatch: 30, trueFalse: 50 },
                balanced: { firstLetter: 30, missingWord: 30, categoryMatch: 25, trueFalse: 15 },
                hard: { firstLetter: 60, missingWord: 30, categoryMatch: 5, trueFalse: 5 }
            };

            const preset = presets[type];
            if (!preset) return;

            document.querySelectorAll('.quiz-slider').forEach(slider => {
                slider.value = preset[slider.dataset.mode];
            });
            updateQuizSliderLabels();

            // Highlight active quiz preset button
            document.querySelectorAll('.btn-quiz-preset').forEach(b => {
                b.classList.toggle('active', b.dataset.qpreset === type);
            });
        }

        function getQuizSettingsFromSliders() {
            const settings = {};
            document.querySelectorAll('.quiz-slider').forEach(slider => {
                settings[slider.dataset.mode] = parseInt(slider.value, 10);
            });
            return settings;
        }

        // ==================== Room Creation ====================

        function createRoom() {
            const name = document.getElementById('roomNameInput').value.trim();
            const mapStyle = document.getElementById('mapStyleInput').value;
            const quizSettings = getQuizSettingsFromSliders();

            const options = {
                name,
                preset: selectedPreset,
                mapStyle: mapStyle,
                quizSettings: quizSettings,
                gameMode: selectedGameMode
            };

            if (selectedGameMode === 'mission') {
                const chapterId = document.getElementById('chapterSelect').value;
                const missionId = document.getElementById('missionSelect').value;
                if (!chapterId || !missionId) {
                    alert('Please select a chapter and mission');
                    return;
                }
                options.worldId = chapterId;
                options.missionId = missionId;
                // Include mission name for display in room settings
                const mission = chapterMissions[chapterId] && chapterMissions[chapterId].find(m => m.id === missionId);
                options.missionName = mission ? mission.name : '';
            }

            socket.emit('createRoom', options, (result) => {
                if (result.success) {
                    currentRoom = result.room;
                    isReady = false;
                    showScreen('roomScreen');
                    renderRoom();
                    if (window.LobbyAnalytics) LobbyAnalytics.trackRoomCreated(selectedPreset, quizSettings);
                } else {
                    alert(result.error);
                }
            });
        }

        function joinRoom(roomId) {
            socket.emit('joinRoom', roomId, (result) => {
                if (result.success) {
                    currentRoom = result.room;
                    isReady = false;
                    showScreen('roomScreen');
                    renderRoom();
                    if (window.LobbyAnalytics) LobbyAnalytics.trackRoomJoined(result.room.players.length);
                } else {
                    alert(result.error);
                }
            });
        }

        function joinInProgressGame(roomId) {
            socket.emit('joinRoom', roomId, (result) => {
                if (result.success) {
                    if (window.LobbyAnalytics) LobbyAnalytics.trackRoomJoined(result.room.players.length);
                    window.location.href = `/?room=${roomId}`;
                } else {
                    alert(result.error);
                }
            });
        }

        function leaveRoom() {
            if (window.LobbyAnalytics) LobbyAnalytics.trackRoomLeave();
            socket.emit('leaveRoom', currentRoom.id, () => {
                currentRoom = null;
                showLobby();
                refreshRooms();
            });
        }

        function quickPlay() {
            socket.emit('quickPlay', (result) => {
                if (result.success) {
                    currentRoom = result.room;
                    isReady = false;
                    showScreen('roomScreen');
                    renderRoom();
                } else {
                    alert(result.error);
                }
            });
        }

        // ==================== Room UI ====================

        function renderRoom() {
            document.getElementById('roomTitle').textContent = currentRoom.name;

            // Show room settings summary
            const s = currentRoom.settings;
            const qs = s.quizSettings || {};
            let settingsHtml;
            if (s.gameMode === 'mission') {
                settingsHtml = `Mode: <strong>Mission</strong> — ${s.missionName || s.missionId} &nbsp;|&nbsp; ` +
                    `Quiz: FL ${qs.firstLetter || 30}% / MW ${qs.missingWord || 30}% / CM ${qs.categoryMatch || 25}% / TF ${qs.trueFalse || 15}%`;
            } else {
                settingsHtml = `Monsters: <strong>${s.presetDisplay || 'Normal'}</strong> &nbsp;|&nbsp; ` +
                    `Quiz: FL ${qs.firstLetter || 30}% / MW ${qs.missingWord || 30}% / CM ${qs.categoryMatch || 25}% / TF ${qs.trueFalse || 15}%`;
            }
            document.getElementById('roomSettings').innerHTML = settingsHtml;

            const isHost = currentRoom.hostId === currentUser.id;
            const me = currentRoom.players.find(p => p.id === currentUser.id);
            isReady = me ? me.ready : false;

            const playerList = document.getElementById('playerList');
            playerList.innerHTML = currentRoom.players.map(p => `
                <div class="player-item">
                    <div class="player-name">
                        <span>👤 ${p.username}</span>
                        ${p.isHost ? '<span class="host-badge">HOST</span>' : ''}
                    </div>
                    <span class="ready-badge ${p.ready || p.isHost ? 'ready-yes' : 'ready-no'}">
                        ${p.isHost ? '✓' : (p.ready ? '✓ Ready' : 'Not Ready')}
                    </span>
                </div>
            `).join('');

            // Waiting slots
            for (let i = currentRoom.players.length; i < currentRoom.maxPlayers; i++) {
                playerList.innerHTML += `
                    <div class="player-item" style="opacity: 0.4;">
                        <span>⏳ Waiting...</span>
                    </div>
                `;
            }

            // Ready/Start buttons
            const readyBtn = document.getElementById('readyBtn');
            const startBtn = document.getElementById('startBtn');

            if (isHost) {
                readyBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
                // Enable start only if all non-hosts are ready and 2+ players
                const allReady = currentRoom.players.filter(p => !p.isHost).every(p => p.ready);
                startBtn.disabled = currentRoom.players.length < 2 || !allReady;
                startBtn.style.opacity = startBtn.disabled ? '0.5' : '1';
            } else {
                readyBtn.classList.remove('hidden');
                startBtn.classList.add('hidden');
                readyBtn.textContent = isReady ? '✓ Ready!' : 'Ready Up';
                readyBtn.className = isReady ? 'btn-success' : 'btn-secondary';
            }
        }

        function toggleReady() {
            isReady = !isReady;
            socket.emit('setReady', { roomId: currentRoom.id, ready: isReady }, (result) => {
                if (result.success) {
                    currentRoom = result.room;
                    renderRoom();
                }
            });
        }

        function startGame() {
            socket.emit('startGame', currentRoom.id, (result) => {
                if (!result.success) {
                    alert(result.error);
                }
            });
        }

        // ==================== UI Helpers ====================

        function showScreen(screenId) {
            ['loginScreen', 'lobbyScreen', 'createRoomScreen', 'roomScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function showLobby() {
            document.getElementById('welcomeMsg').textContent = `Welcome, ${currentUser.username}!`;
            showScreen('lobbyScreen');
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        }
    </script>
</body>
