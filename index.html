<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demon Chase Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e6f2ff;
    }

    canvas {
      border: 1px solid black;
      display: none;
    }

    #menuScreen {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 15px;
      padding: 40px 30px;
      text-align: center;
      color: #fff;
      max-width: 400px;
      width: 100%;
    }

    #menuScreen h1 {
      font-size: 2.5em;
      margin-bottom: 40px;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
    }

    #menuScreen button {
      display: block;
      width: 100%;
      padding: 18px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    #menuScreen button:hover {
      transform: scale(1.03);
    }

    #btnSolo {
      background: linear-gradient(135deg, #e94560, #c23152);
      color: #fff;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
    }

    #btnMultiplayer {
      background: linear-gradient(135deg, #0f3460, #16213e);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 15px rgba(15, 52, 96, 0.4);
    }
  </style>
</head>

<body>
  <div id="menuScreen">
    <h1>Demon Chase</h1>
    <button id="btnSolo">Solo Game</button>
    <button id="btnMultiplayer">Join Multiplayer</button>
  </div>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <script src="bible-verses.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="src/shared/Constants.js"></script>
  <script src="src/shared/LevelConfig.js"></script>
  <script src="src/shared/WallGrid.js"></script>
  <script src="src/client/UILayout.js"></script>
  <script src="src/client/Renderer.js"></script>
  <script src="src/client/InputHandler.js"></script>
  <script src="src/client/Network.js"></script>
  <script src="src/client/ReviewMode.js"></script>
  <script src="src/client/QuizManager.js"></script>
  <script>
    // Parse category from URL query parameters
    const urlParams = new URLSearchParams(window.location.search);
    var gameCategory = urlParams.get('category') || '';
  </script>
  <script src="game.js?v=2.03"></script>
</body>

</html>
