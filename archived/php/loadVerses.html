<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bible Verses</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h1>Bible Verses</h1>
<table id="versesTable">
    <thead>
        <tr>
            <th>Category</th>
            <th>Reference</th>
            <th>Text</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<script>
    async function fetchVerses() {
        try {
            const response = await fetch('https://credtec.co/g1/get_verses.php?category=Hope');
            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }
            const verses = await response.json();
            loadVersesIntoTable(verses);
        } catch (error) {
            console.error('There was a problem with the fetch operation:', error);
        }
    }

    function loadVersesIntoTable(verses) {
        const tableBody = document.getElementById('versesTable').querySelector('tbody');
        verses.forEach(verse => {
            const row = document.createElement('tr');
            const categoryCell = document.createElement('td');
            categoryCell.textContent = verse.category;
            const referenceCell = document.createElement('td');
            referenceCell.textContent = verse.reference;
            const textCell = document.createElement('td');
            textCell.textContent = verse.text;
            row.appendChild(categoryCell);
            row.appendChild(referenceCell);
            row.appendChild(textCell);
            tableBody.appendChild(row);
        });
    }

    // Fetch and display the verses when the page loads
    fetchVerses();
</script>

</body>
</html>
