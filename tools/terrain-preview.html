<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terrain preview — 2D world layer</title>
<style>
    html, body { margin: 0; padding: 0; background: #14161c; color: #c9d2e0; font: 13px/1.4 monospace; }
    #bar { padding: 8px 12px; background: #1c1f28; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    #bar label { display: flex; gap: 6px; align-items: center; }
    select { background: #2a2f3c; color: #dfe6f2; border: 1px solid #3d4453; padding: 3px 6px; border-radius: 4px; }
    #stats { color: #7f8aa0; }
    #stage { padding: 12px; }
    canvas { border: 1px solid #2a2f3c; background: #000; display: block; }
</style>
</head>
<body>
<div id="bar">
    <label>map <select id="map"></select></label>
    <label>theme <select id="theme"></select></label>
    <label>camera
        <input id="camx" type="range" min="0" max="3000" value="1500" style="width:120px">
        <input id="camy" type="range" min="0" max="3000" value="1500" style="width:120px">
    </label>
    <span id="stats"></span>
</div>
<div id="stage"><canvas id="preview" width="512" height="600"></canvas></div>

<!-- The renderer reads these in exactly this order in index.html. -->
<script src="../src/shared/Constants.js?v=2.2"></script>
<script src="../src/client/Viewport.js?v=1.0"></script>
<script src="../src/client/UILayout.js?v=2.12"></script>
<script src="../src/client/TerrainThemes.js?v=1.2"></script>
<script src="../src/client/WallRects.js?v=1.3"></script>
<script src="../src/client/Renderer.js?v=2.52"></script>
<script src="../src/shared/map-generators/ClassicMaze.js?v=1.0"></script>
<script src="../src/shared/map-generators/NarrowPaths.js?v=1.0"></script>
<script src="../src/shared/map-generators/ComplexLabyrinth.js?v=1.0"></script>
<script src="../src/shared/map-generators/OpenPlains.js?v=1.0"></script>
<script src="../src/shared/map-generators/GridCity.js?v=1.0"></script>
<script src="../src/shared/map-generators/index.js?v=1.0"></script>
<script>
/**
 * Terrain preview harness.
 *
 * Renders only the world layer (ground + walls + buildings) for a generated
 * map, with no gameplay, no HUD and no death timer. This is the reliable way to
 * inspect map/theme combinations that would otherwise need a full playthrough
 * to reach — e.g. level 2's `classic` + `earth` combination.
 *
 *   tools/terrain-preview.html?map=classic&theme=earth
 */
(function () {
    const params = new URLSearchParams(window.location.search);
    const canvas = document.getElementById('preview');
    const ctx = canvas.getContext('2d');

    const mapSelect = document.getElementById('map');
    const themeSelect = document.getElementById('theme');
    const camX = document.getElementById('camx');
    const camY = document.getElementById('camy');
    const stats = document.getElementById('stats');

    for (const style of MapGeneratorFactory.AVAILABLE_STYLES) {
        mapSelect.add(new Option(style, style));
    }
    for (const name of TerrainThemes.names()) {
        themeSelect.add(new Option(name, name));
    }
    mapSelect.value = params.get('map') || 'classic';
    themeSelect.value = params.get('theme') || 'earth';

    Viewport.setSize(512, 600, canvas);

    const assets = {};

    // Optional: load the building sheet so prop placement renders too.
    const buildings = new Image();
    buildings.onload = () => { assets.buildingTilesImg = buildings; render(); };
    buildings.src = '../images/terrains/houses-and-buildings400.png';

    let map = null;
    let renderer = null;

    function rebuild() {
        map = MapGeneratorFactory.generateMap(mapSelect.value, 3000, 3000, Constants.CELL_SIZE);
        camX.value = Math.round(map.spawnX);
        camY.value = Math.round(map.spawnY);
    }

    function render() {
        if (!map) rebuild();
        if (!renderer) {
            renderer = new Renderer(canvas, ctx, assets);
            // Exposed so the page can be driven from a console/Playwright for QA.
            window.renderer = renderer;
            window.previewMap = () => map;
        }
        renderer.clear();
        renderer.assets = assets;

        const theme = themeSelect.value;
        const camera = {
            x: Math.max(0, Math.min(Number(camX.value), 3000 - Viewport.width)),
            y: Math.max(0, Math.min(Number(camY.value), 3000 - Viewport.height))
        };

        renderer._wallRectsSource = null;
        renderer._themePatterns = {};
        renderer.drawGround(theme, camera);
        renderer.drawWalls(map.walls, camera, theme);

        const drawn = renderer._wallRects.length;
        stats.textContent = mapSelect.value + ' / ' + theme +
            ' — cells ' + map.walls.length +
            ', rects ' + drawn +
            ', camera ' + Math.round(camera.x) + ',' + Math.round(camera.y);
    }

    mapSelect.addEventListener('change', () => { rebuild(); render(); });
    themeSelect.addEventListener('change', render);
    camX.addEventListener('input', render);
    camY.addEventListener('input', render);

    rebuild();
    render();
})();
</script>
</body>
</html>
